name: Code quality

on:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version-file: package.json
      - name: Run Biome
        run: biome ci .