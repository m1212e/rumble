name: Fallow

on:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun i
      - name: Run fallow audit
        run: bunx fallow audit --base origin/${{ github.base_ref }}
