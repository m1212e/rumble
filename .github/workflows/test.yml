name: Test

on:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun i
      - name: Download address data
        run: bun run generate:address-data
      - name: Run tests
        run: bun test