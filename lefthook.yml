# Mirrors the CI checks (.github/workflows) so failures surface locally first.
pre-commit:
  parallel: true
  commands:
    biome:
      # no glob: let biome decide which files it handles (js/ts/json/css/md/...)
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    fallow:
      glob: "*.{js,ts,cjs,mjs,jsx,tsx,svelte}"
      run: bunx fallow audit

pre-push:
  parallel: true
  commands:
    biome:
      # same as code_quality.yml
      run: bunx biome ci . --colors=off
    typecheck:
      run: bun run typecheck
    test:
      run: bun test
    fallow:
      run: bunx fallow audit
